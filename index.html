<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elven Empire — Graphical</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>

    <!-- Top status bar -->
    <div id="topbar">
      <span class="stat" title="Elves">🧝 <b id="stat-pop">0</b></span>
      <span class="stat" title="Wood">🪵 <b id="stat-wood">0</b></span>
      <span class="stat" title="Stone">🪨 <b id="stat-stone">0</b></span>
      <span class="stat" title="Ore">⛏️ <b id="stat-ore">0</b></span>
      <span class="stat" title="Food">🍄 <b id="stat-food">0</b></span>
      <span class="stat" title="Water">💧 <b id="stat-water">0</b></span>
      <span class="stat" id="stat-research" title="Research points">🔬 <b>0</b></span>
      <span class="stat" id="stat-outbreak" title="The outbreak escalates with your research progress" style="display:none"></span>
      <span class="stat" id="stat-threat" title="Threat · Soldiers" style="display:none;color:#e08a6a"></span>
      <span id="door-ctl" style="display:none">
        <button class="spd" id="lock-doors-btn" title="Lock all doors">🔒</button>
        <button class="spd" id="unlock-doors-btn" title="Unlock all doors">🔓</button>
      </span>
      <span id="zlevel-ctl" style="display:none" title="Current floor">
        <button class="spd" id="zlevel-up" title="Floor up ([)">▲</button>
        <span class="stat"><b id="stat-zlevel">⛰️ Surface</b></span>
        <button class="spd" id="zlevel-down" title="Floor down (])">▼</button>
      </span>
      <span class="stat clock" title="Time"><span id="stat-clock">Day 1 · 06:00</span></span>
      <span id="speed-ctl" title="Game speed">
        <button class="spd" data-spd="pause" title="Pause (Space)">⏸</button>
        <button class="spd on" data-spd="1" title="Normal speed">▶</button>
        <button class="spd" data-spd="2" title="Fast (2×)">⏩</button>
        <button class="spd" data-spd="4" title="Fastest (4×)">⏭</button>
      </span>
      <button id="sound-btn" class="spd" title="Sound on — click to mute">🔊</button>
      <button id="autopause-btn" class="spd" title="Auto-pause on crises (raid, death, starvation, dehydration)">🔔</button>
      <button id="help-btn" class="spd" title="Tutorial / Help">❓</button>
      <button id="menu-btn" title="Menu (Esc)">☰ Menu</button>
    </div>

    <!-- Right info panel -->
    <div id="panel">
      <div id="panel-tabs">
        <button class="ptab active" data-tab="colony">Colony</button>
        <button class="ptab" data-tab="schedule">Schedule</button>
        <button class="ptab" data-tab="research">Research</button>
        <button class="ptab" data-tab="log">Log</button>
        <button class="ptab" data-tab="records">Records</button>
        <button class="ptab" data-tab="stats">Stats</button>
      </div>
      <div id="panel-content"></div>
    </div>

    <!-- Bottom log -->
    <div id="log"></div>

    <!-- Colonist portrait strip — click one to select/center on them -->
    <div id="colonistbar"></div>

    <!-- Bottom-center architect bar: categories expand upward into #flyout -->
    <div id="archbar">
      <button class="tool active" data-tool="select" title="Inspect (Q)"><span class="ico">🔍</span><span class="lbl">Inspect</span></button>
      <button class="cat" data-cat="designate" title="Designate orders"><span class="ico">⛏️</span><span class="lbl">Orders</span></button>
      <button class="cat" data-cat="build" title="Build structures"><span class="ico">🏗️</span><span class="lbl">Build</span><span class="cat-badge" id="build-mat-badge">🪨</span></button>
      <button class="cat" data-cat="zone" title="Designate zones"><span class="ico">📐</span><span class="lbl">Zones</span></button>
      <button class="tool" data-tool="erase" title="Cancel / deconstruct (X)"><span class="ico">🚫</span><span class="lbl">Cancel</span></button>
    </div>

    <!-- Fly-out submenus for each archbar category, expanding upward -->
    <div id="flyout" class="hidden">
      <div class="fly-group" data-group="designate">
        <div class="fly-title">⛏️ Designate Orders</div>
        <div class="fly-tools">
          <button class="tool" data-tool="dig" title="Mine stone (D)"><span class="ico">⛏️</span><span class="lbl">Mine</span></button>
          <button class="tool" data-tool="chop" title="Chop trees (C)"><span class="ico">🪓</span><span class="lbl">Chop</span></button>
          <button class="tool" data-tool="gather" title="Gather plants (G)"><span class="ico">🌿</span><span class="lbl">Gather</span></button>
          <button class="tool" data-tool="forest" title="Plant a tree — needs the Foresting labor (P)"><span class="ico">🌲</span><span class="lbl">Plant Tree</span></button>
          <button class="tool" data-tool="stairsdown" title="Dig a stairwell down to the level below (Z)"><span class="ico">🌀</span><span class="lbl">Dig Stairs</span></button>
          <button class="tool" data-tool="rampdown" title="Dig a ramp down — cheaper/faster alternative to stairs, same connection (A)"><span class="ico">⤵️</span><span class="lbl">Dig Ramp</span></button>
          <button class="tool" data-tool="drain" title="Drain a flooded chamber back to dry floor (V)"><span class="ico">🪣</span><span class="lbl">Drain</span></button>
        </div>
      </div>
      <div class="fly-group" data-group="build">
        <div class="fly-title">🏗️ Build Structures</div>
        <div class="fly-sub">Material — applies to wall/floor/door/furniture below</div>
        <div class="fly-tools">
          <button class="tool mat-btn" data-material="wood" title="Wood"><span class="ico">🪵</span><span class="lbl">Wood</span></button>
          <button class="tool mat-btn active" data-material="stone" title="Stone"><span class="ico">🪨</span><span class="lbl">Stone</span></button>
          <button class="tool mat-btn" data-material="marble" title="Marble — a rare vein found while mining; small mood bonus in a bedroom"><span class="ico">⬜</span><span class="lbl">Marble</span></button>
          <button class="tool mat-btn" data-material="metal" title="Metal — iron bars; small mood bonus in a bedroom"><span class="ico">⚙️</span><span class="lbl">Metal</span></button>
        </div>
        <div class="fly-sub">Construction</div>
        <div class="fly-tools">
          <button class="tool" data-tool="build" title="Wall (B)"><span class="ico">🧱</span><span class="lbl">Wall</span></button>
          <button class="tool" data-tool="floor" title="Floor (F)"><span class="ico">▦</span><span class="lbl">Floor</span></button>
        </div>
        <div class="fly-sub">Furniture</div>
        <div class="fly-tools">
          <button class="tool" data-tool="bed" title="Bed (E)"><span class="ico">🛏️</span><span class="lbl">Bed</span></button>
          <button class="tool" data-tool="doublebed" title="Double bed — partners can share it"><span class="ico">💞</span><span class="lbl">Double Bed</span></button>
          <button class="tool" data-tool="table" title="Table — needs Fine Furniture" style="display:none"><span class="ico">🪑</span><span class="lbl">Table</span></button>
          <button class="tool" data-tool="painting" title="Painting — lifts mood for elves in the same zone"><span class="ico">🖼️</span><span class="lbl">Painting</span></button>
        </div>
        <div class="fly-sub">Workshops</div>
        <div class="fly-tools">
          <button class="tool" data-tool="smelter" title="Smelter — ore → bars (1)"><span class="ico">🔥</span><span class="lbl">Smelter</span></button>
          <button class="tool" data-tool="forge" title="Forge — bars → arms (2)"><span class="ico">⚒️</span><span class="lbl">Forge</span></button>
          <button class="tool" data-tool="well" title="Well — draws water (3)"><span class="ico">💧</span><span class="lbl">Well</span></button>
          <button class="tool" data-tool="brewery" title="Brewery — water + food → ale (4)"><span class="ico">🍺</span><span class="lbl">Brewery</span></button>
        </div>
        <div class="fly-sub">Defenses</div>
        <div class="fly-tools">
          <button class="tool" data-tool="door" title="Door — passable, but lockable during raids (O)"><span class="ico">🚪</span><span class="lbl">Door</span></button>
          <button class="tool" data-tool="palisade" title="Palisade — a quick stake wall, half the build time of a proper wall"><span class="ico">🥢</span><span class="lbl">Palisade</span></button>
          <button class="tool" data-tool="watchtower" title="Watchtower — a soldier fighting from one hits harder and takes less damage"><span class="ico">🗼</span><span class="lbl">Watchtower</span></button>
          <button class="tool" data-tool="trap" title="Trap — damages a raider that steps on it, resets after a cooldown"><span class="ico">⚠️</span><span class="lbl">Trap</span></button>
        </div>
        <div class="fly-sub">Arcane</div>
        <div class="fly-tools">
          <button class="tool" data-tool="generator" title="Essence Well — generates Essence power for any conduit network it touches · needs Essence Craft (5)" style="display:none"><span class="ico">🔮</span><span class="lbl">Essence Well</span></button>
          <button class="tool" data-tool="conduit" title="Arcane Conduit — embedded wiring; carries Essence between an Essence Well and Frost Chambers · needs Essence Craft (U)" style="display:none"><span class="ico">🔗</span><span class="lbl">Conduit</span></button>
          <button class="tool" data-tool="icebox" title="Frost Chamber — once powered, slows spoilage for food resting nearby · needs Essence Craft (6)" style="display:none"><span class="ico">❄️</span><span class="lbl">Frost Chamber</span></button>
        </div>
      </div>
      <div class="fly-group" data-group="zone">
        <div class="fly-title">📐 Designate Zones</div>
        <div class="fly-tools">
          <button class="tool" data-tool="stockpile" title="Stockpile (S)"><span class="ico">📦</span><span class="lbl">Stockpile</span></button>
          <button class="tool" data-tool="bedroom" title="Bedroom (R)"><span class="ico">🛌</span><span class="lbl">Bedroom</span></button>
          <button class="tool" data-tool="dining" title="Dining hall (T)"><span class="ico">🍽️</span><span class="lbl">Dining</span></button>
          <button class="tool" data-tool="depot" title="Trade Depot — caravans buy/sell here (Y)"><span class="ico">🐎</span><span class="lbl">Depot</span></button>
          <button class="tool" data-tool="farm" title="Farm — grows food · needs Agriculture" style="display:none"><span class="ico">🌾</span><span class="lbl">Farm</span></button>
          <button class="tool" data-tool="study" title="Study — boosts research · needs Scholarship" style="display:none"><span class="ico">📚</span><span class="lbl">Study</span></button>
          <button class="tool" data-tool="hospital" title="Hospital — heals faster · needs Medicine" style="display:none"><span class="ico">⚕️</span><span class="lbl">Hospital</span></button>
          <button class="tool" data-tool="quarantine" title="Quarantine — confines exposed vampires · needs Medicine" style="display:none"><span class="ico">⛓️</span><span class="lbl">Quarantine</span></button>
        </div>
      </div>
    </div>

    <!-- Toast messages -->
    <div id="toast"></div>

    <!-- Tutorial walkthrough -->
    <div id="tutorial-card" class="hidden"></div>

    <!-- Fullscreen overlay for menus (built dynamically) -->
    <div id="overlay" class="hidden"></div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/research.js"></script>
  <script src="js/milestones.js"></script>
  <script src="js/db.js"></script>
  <script src="js/world.js"></script>
  <script src="js/pathfinding.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/save.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
