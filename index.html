<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elven Empire — Graphical</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>

    <!-- Top status bar -->
    <div id="topbar">
      <span class="stat" title="Elves">🧝 <b id="stat-pop">0</b></span>
      <span class="stat" title="Wood">🪵 <b id="stat-wood">0</b></span>
      <span class="stat" title="Stone">🪨 <b id="stat-stone">0</b></span>
      <span class="stat" title="Ore">⛏️ <b id="stat-ore">0</b></span>
      <span class="stat" title="Food">🍄 <b id="stat-food">0</b></span>
      <span class="stat" title="Water">💧 <b id="stat-water">0</b></span>
      <span class="stat" id="stat-research" title="Research points">🔬 <b>0</b></span>
      <span class="stat" id="stat-threat" title="Threat · Soldiers" style="display:none;color:#e08a6a"></span>
      <span id="door-ctl" style="display:none">
        <button class="spd" id="lock-doors-btn" title="Lock all doors">🔒</button>
        <button class="spd" id="unlock-doors-btn" title="Unlock all doors">🔓</button>
      </span>
      <span class="stat clock" title="Time"><span id="stat-clock">Day 1 · 06:00</span></span>
      <span id="speed-ctl" title="Game speed">
        <button class="spd" data-spd="pause" title="Pause (Space)">⏸</button>
        <button class="spd on" data-spd="1" title="Normal speed">▶</button>
        <button class="spd" data-spd="2" title="Fast (2×)">⏩</button>
        <button class="spd" data-spd="4" title="Fastest (4×)">⏭</button>
      </span>
      <button id="sound-btn" class="spd" title="Sound on — click to mute">🔊</button>
      <button id="menu-btn" title="Menu (Esc)">☰ Menu</button>
    </div>

    <!-- Left toolbar: categories with fly-out submenus -->
    <div id="toolbar">
      <button class="tool active" data-tool="select" title="Inspect (Q)"><span class="ico">🔍</span><span class="lbl">Inspect</span></button>
      <button class="cat" data-cat="designate" title="Designate orders"><span class="ico">⛏️</span><span class="lbl">Orders</span></button>
      <button class="cat" data-cat="build" title="Build structures"><span class="ico">🏗️</span><span class="lbl">Build</span></button>
      <button class="cat" data-cat="zone" title="Designate zones"><span class="ico">📐</span><span class="lbl">Zones</span></button>
      <button class="tool" data-tool="erase" title="Cancel / deconstruct (X)"><span class="ico">🚫</span><span class="lbl">Cancel</span></button>
    </div>

    <!-- Fly-out submenus for each toolbar category -->
    <div id="flyout" class="hidden">
      <div class="fly-group" data-group="designate">
        <div class="fly-title">⛏️ Designate Orders</div>
        <div class="fly-tools">
          <button class="tool" data-tool="dig" title="Mine stone (D)"><span class="ico">⛏️</span><span class="lbl">Mine</span></button>
          <button class="tool" data-tool="chop" title="Chop trees (C)"><span class="ico">🪓</span><span class="lbl">Chop</span></button>
          <button class="tool" data-tool="gather" title="Gather plants (G)"><span class="ico">🌿</span><span class="lbl">Gather</span></button>
        </div>
      </div>
      <div class="fly-group" data-group="build">
        <div class="fly-title">🏗️ Build Structures</div>
        <div class="fly-sub">Construction</div>
        <div class="fly-tools">
          <button class="tool" data-tool="build" title="Stone wall (B)"><span class="ico">🧱</span><span class="lbl">Wall</span></button>
          <button class="tool" data-tool="floor" title="Stone floor (F)"><span class="ico">▦</span><span class="lbl">Floor</span></button>
        </div>
        <div class="fly-sub">Furniture</div>
        <div class="fly-tools">
          <button class="tool" data-tool="bed" title="Bed — costs wood (E)"><span class="ico">🛏️</span><span class="lbl">Bed</span></button>
          <button class="tool" data-tool="table" title="Table — costs wood · needs Fine Furniture" style="display:none"><span class="ico">🪑</span><span class="lbl">Table</span></button>
        </div>
        <div class="fly-sub">Workshops</div>
        <div class="fly-tools">
          <button class="tool" data-tool="smelter" title="Smelter — ore → bars (1)"><span class="ico">🔥</span><span class="lbl">Smelter</span></button>
          <button class="tool" data-tool="forge" title="Forge — bars → arms (2)"><span class="ico">⚒️</span><span class="lbl">Forge</span></button>
          <button class="tool" data-tool="well" title="Well — draws water (3)"><span class="ico">💧</span><span class="lbl">Well</span></button>
          <button class="tool" data-tool="brewery" title="Brewery — water + food → ale (4)"><span class="ico">🍺</span><span class="lbl">Brewery</span></button>
        </div>
        <div class="fly-sub">Defenses</div>
        <div class="fly-tools">
          <button class="tool" data-tool="door" title="Door — passable, but lockable during raids (O)"><span class="ico">🚪</span><span class="lbl">Door</span></button>
        </div>
      </div>
      <div class="fly-group" data-group="zone">
        <div class="fly-title">📐 Designate Zones</div>
        <div class="fly-tools">
          <button class="tool" data-tool="stockpile" title="Stockpile (S)"><span class="ico">📦</span><span class="lbl">Stockpile</span></button>
          <button class="tool" data-tool="bedroom" title="Bedroom (R)"><span class="ico">🛌</span><span class="lbl">Bedroom</span></button>
          <button class="tool" data-tool="dining" title="Dining hall (T)"><span class="ico">🍽️</span><span class="lbl">Dining</span></button>
          <button class="tool" data-tool="depot" title="Trade Depot — caravans buy/sell here (Y)"><span class="ico">🐎</span><span class="lbl">Depot</span></button>
          <button class="tool" data-tool="farm" title="Farm — grows food · needs Agriculture" style="display:none"><span class="ico">🌾</span><span class="lbl">Farm</span></button>
          <button class="tool" data-tool="study" title="Study — boosts research · needs Scholarship" style="display:none"><span class="ico">📚</span><span class="lbl">Study</span></button>
          <button class="tool" data-tool="hospital" title="Hospital — heals faster · needs Medicine" style="display:none"><span class="ico">⚕️</span><span class="lbl">Hospital</span></button>
        </div>
      </div>
    </div>

    <!-- Right info panel -->
    <div id="panel">
      <div id="panel-tabs">
        <button class="ptab active" data-tab="colony">Colony</button>
        <button class="ptab" data-tab="schedule">Schedule</button>
        <button class="ptab" data-tab="research">Research</button>
        <button class="ptab" data-tab="log">Log</button>
        <button class="ptab" data-tab="records">Records</button>
      </div>
      <div id="panel-content"></div>
    </div>

    <!-- Bottom log -->
    <div id="log"></div>

    <!-- Help hint -->
    <div id="hint">
      Drag to designate · Arrows or right-drag to pan · Scroll to zoom · Space to pause
    </div>

    <!-- Toast messages -->
    <div id="toast"></div>

    <!-- Fullscreen overlay for menus (built dynamically) -->
    <div id="overlay" class="hidden"></div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/research.js"></script>
  <script src="js/db.js"></script>
  <script src="js/world.js"></script>
  <script src="js/pathfinding.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/save.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
